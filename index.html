{id:'vaccine',topic:'vaccine',icon:'💉',title:'چرا واکسن؟',summary:'واکسن مثل یه تمرین کوچیک برای بدن بچه‌ست. بهش یاد می‌ده چطور با میکروب‌های خطرناک بجنگه، بدون اینکه واقعاً مریض بشه.',body:`
<div class="edu-section"><h3>🎯 واکسن چیکار می‌کنه؟</h3><p>فکر کن بدن بچه یه سرباز تازه‌کاره. واکسن براش یه «مانور تمرینی» می‌ذاره. یه تیکه از میکروب (ضعیف شده یا کشته شده) رو نشونش می‌ده تا بدن یاد بگیره چطور باهاش بجنگه. بعداً اگه میکروب واقعی حمله کرد، بدن آماده‌ست و سریع شکستش می‌ده. 💪</p></div>
<div class="edu-section"><h3>❓ چرا مهمه؟</h3><p>چون از بیماری‌های خطرناکی جلوگیری می‌کنه که می‌تونن بچه رو خیلی مریض کنن، یا حتی باعث معلولیت بشن. با یه واکسن ساده، بچه‌ت رو از شر این بیماری‌ها راحت می‌کنی.</p></div>

<tr><td>💉 شش‌گانه</td><td>۵ بیماری خطرناک + فلج اطفال تزریقی</td></tr>

<tr><td>💉 MMR</td><td>سرخک، اوریون، سرخجه</td></tr>
